issues:
  - id: pr10-1
    file: app/routes/webhooks.py
    line_hint: 56            # `sign(...) != x_signature`
    area: security
    severity: high
    requires: diff
    description: >-
      The webhook signature is checked with a plain string comparison (`!=`) instead of
      `hmac.compare_digest`, which the neighbouring shipping webhook uses. The comparison is not
      constant-time, so an attacker can recover a valid signature byte by byte through response
      timing and then forge refund events.
  - id: pr10-2
    file: app/routes/webhooks.py
    line_hint: 77            # `detail=f"Could not process webhook: {exc}"`
    area: standards
    severity: medium
    rule_id: R6
    requires: rules
    description: >-
      The catch-all handler puts the exception text into the HTTP response
      (`detail=f"Could not process webhook: {exc}"`). R6 requires logging the exception and
      returning a generic message; the text of a database or parsing error can leak internals to
      the caller.
