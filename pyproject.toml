[project]
name = "ai-pr-reviewer"
version = "0.1.0"
description = "Pipeline-based AI code reviewer: context, specialists, verifier, triage, measured against a single-prompt baseline."
readme = "README.md"
authors = [
    { name = "Clarence Cabang", email = "ckcabang@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "numpy>=2.2.6",
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
reviewer = "reviewer.cli:main"

[tool.uv.build-backend]
module-name = "reviewer"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# importlib mode + pythonpath let the repo's tests and demo_service/tests share one run
# without basename collisions; the service imports as `app`.
addopts = "--import-mode=importlib"
pythonpath = [".", "demo_service"]
